<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>order-agent</title>
<style>
  :root {
    --bg: #FDF8F5; --card: #ffffff; --border: #EBE0D8; --divider: #F0E8E2;
    --text: #2C1810; --muted: #6B5248; --faint: #A08070;
    --accent: #C0593A; --accent-soft: #FAEEE9;
    --ok-bg: #dcfce7; --ok-text: #166534; --ok-border: #bbf7d0;
    --warn-bg: #fef3c7; --warn-text: #92400e; --warn-border: #fde68a;
    --bad-bg: #fee2e2; --bad-text: #991b1b; --bad-border: #fecaca;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .topbar .brand { color: var(--accent); font-weight: 800; font-size: 1.125rem; letter-spacing: -0.01em; }
  .topbar .tag { color: var(--faint); font-size: 0.625rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; margin-top: 1px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 80px; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.8125rem; margin: 0; }
  .status-pill { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    padding: 5px 13px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .s-submitted, .s-in_review { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .s-confirmed { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
  .s-partially_confirmed { background: var(--accent-soft); color: var(--accent); border-color: #f0d5cc; }
  .s-cancelled { background: var(--bad-bg); color: var(--bad-text); border-color: var(--bad-border); }
  .line { background: var(--card); border: 1px solid var(--border); border-radius: 1rem;
    box-shadow: 0 1px 2px rgba(44,24,16,.04); padding: 18px; margin-bottom: 12px; }
  .line h3 { margin: 0 0 4px; font-size: 0.9375rem; font-weight: 600; }
  .qty { color: var(--faint); font-size: 0.75rem; margin-bottom: 10px; }
  .stock-pill { font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    display: inline-block; border: 1px solid; }
  .stock-in_stock { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
  .stock-limited { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .stock-out_of_stock { background: var(--bad-bg); color: var(--bad-text); border-color: var(--bad-border); }
  .clarify-q { font-size: 0.8125rem; color: var(--muted); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; color: var(--text); padding: 8px 14px; font-size: 0.8125rem; text-align: left; }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .chip:disabled { opacity: .5; cursor: not-allowed; }
  .fallback { display: flex; gap: 8px; margin-top: 8px; }
  .fallback input[type=text] { flex: 1; border: 1px solid var(--border); border-radius: 0.625rem;
    padding: 8px 10px; font: inherit; background: var(--bg); color: var(--text); }
  .fallback input[type=text]:focus { outline: none; border-color: var(--accent); }
  .fallback button { white-space: nowrap; }
  .fallback-toggle { border: none; background: none; color: var(--faint); font-size: 0.75rem;
    text-decoration: underline; cursor: pointer; padding: 0; }
  .fallback-toggle:hover { color: var(--accent); }
  .note-saved { font-size: 0.8125rem; color: var(--muted); font-style: italic; }
  button { font: inherit; cursor: pointer; }
  .refresh { border: 1px solid var(--border); border-radius: 0.75rem; background: #fff; color: var(--muted);
    padding: 6px 12px; font-size: 0.75rem; font-weight: 500; }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .footnote { color: var(--faint); font-size: 0.75rem; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Order Agent</span>
  <div class="tag">PO Intake</div>
</div>
<div class="wrap" id="wrap">
  <p class="sub">Loading order…</p>
</div>

<script>
const orderId = window.location.pathname.split("/").filter(Boolean).pop();

const STATUS_LABEL = {
  submitted: "Submitted", in_review: "Being reviewed",
  confirmed: "Confirmed", partially_confirmed: "Partially confirmed", cancelled: "Cancelled",
};
const STOCK_LABEL = { in_stock: "In stock", limited: "Limited stock", out_of_stock: "Out of stock" };

let pollTimer = null;

function lineCard(line) {
  const qty = `${line.quantity ?? "?"} ${line.unit ?? ""}`.trim();
  let body = "";

  if (line.state === "resolved") {
    const stockHtml = line.stock_band
      ? `<span class="stock-pill stock-${line.stock_band}">${STOCK_LABEL[line.stock_band]}</span>`
      : "";
    body = `<div style="font-size:0.875rem; margin-bottom:6px;">${line.product_name}</div>${stockHtml}`;
  } else if (line.state === "needs_clarification") {
    const chips = line.options.map((o) =>
      `<button class="chip" onclick="chooseOption('${line.id}', ${o.index}, this)">${o.label}</button>`
    ).join("");
    body = `
      <div class="clarify-q">We found a few options for this — which one did you mean?</div>
      <div class="chips">${chips}</div>
      <button class="fallback-toggle" onclick="toggleFallback('${line.id}')">None of these — type what you meant</button>
      <div class="fallback" id="fallback-${line.id}" style="display:none;">
        <input type="text" id="fallback-input-${line.id}" placeholder="Describe what you meant" />
        <button onclick="submitNote('${line.id}')">Send</button>
      </div>
    `;
  } else if (line.state === "no_match") {
    body = `
      <div class="clarify-q">We couldn't automatically match this to something in the catalogue — tell us more and a distributor will follow up.</div>
      <div class="fallback">
        <input type="text" id="fallback-input-${line.id}" placeholder="Describe what you meant" />
        <button onclick="submitNote('${line.id}')">Send</button>
      </div>
    `;
  } else if (line.state === "noted") {
    body = `<div class="note-saved">You said: "${line.note}" — a distributor will follow up.</div>`;
  }

  return `<div class="line" id="line-${line.id}"><h3>"${line.raw_text}"</h3><div class="qty">Requested: ${qty}</div>${body}</div>`;
}

function render(data) {
  const { order, lines } = data;
  const html = `
    <div class="head-row">
      <div>
        <h1>Order status</h1>
        <p class="sub">${order.order_text}</p>
      </div>
      <span class="status-pill s-${order.status}">${STATUS_LABEL[order.status] || order.status}</span>
    </div>
    ${lines.map(lineCard).join("")}
    <button class="refresh" onclick="load()">Refresh status</button>
    <p class="footnote">This page updates automatically once a distributor reviews your order.</p>
  `;
  document.getElementById("wrap").innerHTML = html;

  const terminal = order.status === "confirmed" || order.status === "partially_confirmed" || order.status === "cancelled";
  if (pollTimer) clearInterval(pollTimer);
  if (!terminal) pollTimer = setInterval(load, 6000);
}

async function load() {
  try {
    const res = await fetch(`/api/orders/${orderId}`);
    if (!res.ok) throw new Error("Order not found");
    render(await res.json());
  } catch (err) {
    document.getElementById("wrap").innerHTML = `<p class="sub">${err.message}</p>`;
  }
}

window.toggleFallback = (lineId) => {
  const el = document.getElementById(`fallback-${lineId}`);
  el.style.display = el.style.display === "none" ? "flex" : "none";
};

window.chooseOption = async (lineId, optionIndex, btn) => {
  document.querySelectorAll(`#line-${lineId} .chip`).forEach((c) => (c.disabled = true));
  try {
    const res = await fetch(`/api/orders/${orderId}/lines/${lineId}/choose`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ optionIndex }),
    });
    if (!res.ok) throw new Error((await res.json()).error);
    await load();
  } catch (err) {
    alert("Couldn't save your choice: " + err.message);
    document.querySelectorAll(`#line-${lineId} .chip`).forEach((c) => (c.disabled = false));
  }
};

window.submitNote = async (lineId) => {
  const input = document.getElementById(`fallback-input-${lineId}`);
  const note = input.value.trim();
  if (!note) return;
  try {
    const res = await fetch(`/api/orders/${orderId}/lines/${lineId}/note`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note }),
    });
    if (!res.ok) throw new Error((await res.json()).error);
    await load();
  } catch (err) {
    alert("Couldn't save that: " + err.message);
  }
};

load();
</script>
</body>
</html>
