<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>order-agent</title>
<style>
  :root {
    --bg: #FDF8F5; --card: #ffffff; --border: #EBE0D8; --divider: #F0E8E2;
    --text: #2C1810; --muted: #6B5248; --faint: #A08070;
    --accent: #C0593A; --accent-soft: #FAEEE9; --accent-hover: #F5EDE8;
    --bad-bg: #fee2e2; --bad-text: #991b1b; --bad-border: #fecaca;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .topbar .brand { color: var(--accent); font-weight: 800; font-size: 1.125rem; letter-spacing: -0.01em; }
  .topbar .tag { color: var(--faint); font-size: 0.625rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; margin-top: 1px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.375rem; font-weight: 700; margin: 0 0 6px; color: var(--text); }
  .sub { color: var(--muted); margin: 0 0 26px; font-size: 0.875rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem;
    box-shadow: 0 1px 2px rgba(44,24,16,.04); padding: 22px; }
  label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted);
    margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], textarea { width: 100%; background: #fff; color: var(--text);
    border: 1px solid var(--border); border-radius: 0.75rem; padding: 11px 12px; font: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .name-row { display: flex; gap: 10px; }
  .name-row > div { flex: 1; }
  .samples { margin: 10px 0 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 0.75rem; border: 1px solid var(--border);
    background: #fff; color: var(--muted); padding: 7px 13px; font-weight: 500; transition: .15s; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.small { padding: 4px 10px; font-size: 0.75rem; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    width: 100%; padding: 12px; margin-top: 20px; font-size: 0.9375rem; }
  button.primary:hover { background: #a84d31; color: #fff; }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  .error { background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad-text);
    padding: 12px 16px; border-radius: 0.75rem; margin-top: 16px; font-size: 0.875rem; }
  .footnote { color: var(--faint); font-size: 0.75rem; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Order Agent</span>
  <div class="tag">PO Intake</div>
</div>
<div class="wrap">
  <h1>Place an order</h1>
  <p class="sub">Type your order the way you normally would — brand, quantity, unit, whatever you know. We'll ask if anything's unclear.</p>

  <div class="card">
    <div class="name-row">
      <div>
        <label for="buyerName">Your name</label>
        <input type="text" id="buyerName" placeholder="e.g. Bilal Ahmad" />
      </div>
      <div>
        <label for="buyerPhone">Phone</label>
        <input type="text" id="buyerPhone" placeholder="e.g. 98765 43210" />
      </div>
    </div>

    <label for="orderText">Order</label>
    <textarea id="orderText" placeholder="e.g. ambuja opc 43 ke 150 bora, 12mm saria 2 ton tata"></textarea>
    <div class="samples">
      <button class="small" type="button" data-sample="0">Sample order 1</button>
      <button class="small" type="button" data-sample="1">Sample order 2</button>
      <button class="small" type="button" data-sample="2">Sample order 3</button>
    </div>

    <button class="primary" id="submitBtn">Submit order</button>
    <div id="errorArea"></div>
  </div>

  <p class="footnote">A distributor reviews every order before anything ships — you'll see the status update once they have.</p>
</div>

<script>
const SAMPLES = [
  "ambuja opc 43 ke 150 bora, 12mm saria 2 ton tata",
  "100 bags cement extra, kajaria 2x2 tile 40 box",
  "jaguar tap 6 piece, 20mm gitti 500 cft",
];
document.querySelectorAll("[data-sample]").forEach((b) =>
  b.addEventListener("click", () => {
    document.getElementById("orderText").value = SAMPLES[Number(b.dataset.sample)];
  })
);

const submitBtn = document.getElementById("submitBtn");
submitBtn.addEventListener("click", async () => {
  const orderText = document.getElementById("orderText").value.trim();
  const errorArea = document.getElementById("errorArea");
  errorArea.innerHTML = "";
  if (!orderText) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";
  try {
    const res = await fetch("/api/orders", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        buyerName: document.getElementById("buyerName").value.trim(),
        buyerPhone: document.getElementById("buyerPhone").value.trim(),
        orderText,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong");
    if (!data.orderId) {
      errorArea.innerHTML = `<div class="error">${data.notes || "No material line items found in that text. This tool takes materials orders — a service or labour request (e.g. \"send an electrician\") won't produce any order lines."}</div>`;
      return;
    }
    window.location.href = `/orders/${data.orderId}`;
  } catch (err) {
    errorArea.innerHTML = `<div class="error">${err.message}</div>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit order";
  }
});
</script>
</body>
</html>
